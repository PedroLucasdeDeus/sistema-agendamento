{% extends "base.html" %}

{% block content %}
<h1>Agendamentos</h1>

<form hx-post="/agendamentos" hx-target="#lista-agendamentos" hx-swap="afterbegin">
    <label>Cliente
        <select name="cliente_id" required>
            {% for cliente in clientes %}
            <option value="{{ cliente.id }}">{{ cliente.nome }}</option>
            {% endfor %}
        </select>
    </label>
    <label>Horário
        <select name="horario_id" required>
            {% for horario in horarios_disponiveis %}
            <option value="{{ horario.id }}">{{ horario.data }} - {{ horario.hora }}</option>
            {% endfor %}
        </select>
    </label>
    <button type="submit">Agendar</button>
</form>

<table>
    <thead>
        <tr>
            <th>Cliente</th>
            <th>Data</th>
            <th>Hora</th>
            <th>Ações</th>
        </tr>
    </thead>
    <tbody id="lista-agendamentos">
        {% for agendamento in agendamentos %}
        {% include "agendamentos/_linha.html" %}
        {% else %}
        <tr>
            <td colspan="4">Nenhum agendamento ativo encontrado.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
