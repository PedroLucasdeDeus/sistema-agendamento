{% extends "base.html" %}

{% block content %}
<h1>Agendamentos</h1>

<table>
    <thead>
        <tr>
            <th>Cliente</th>
            <th>Data</th>
            <th>Hora</th>
            <th>Ações</th>
        </tr>
    </thead>
    <tbody>
        {% for agendamento in agendamentos %}
        {% include "agendamentos/_linha.html" %}
        {% else %}
        <tr>
            <td colspan="4">Nenhum agendamento ativo encontrado.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
